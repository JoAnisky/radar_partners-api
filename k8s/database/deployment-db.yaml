apiVersion: apps/v1
kind: Deployment
metadata:
    name: radar-db
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: radar-db
    template:
        metadata:
            labels:
                app: radar-db
        spec:
            containers:
                - name: postgres
                  image: postgres:17-alpine
                  env:
                      - name: POSTGRES_DB
                        value: radar
                      # Secret créé par Jenkins : clés `user` et `password`
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: radar-db-secret
                                key: user
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: radar-db-secret
                                key: password
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                  ports:
                      - containerPort: 5432
                  volumeMounts:
                      - name: db-storage
                        mountPath: /var/lib/postgresql/data
                  readinessProbe:
                      exec:
                          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
                      initialDelaySeconds: 5
                      periodSeconds: 10
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "50m"
                      limits:
                          memory: "384Mi"
                          cpu: "300m"
            volumes:
                - name: db-storage
                  persistentVolumeClaim:
                      claimName: radar-db-pvc
