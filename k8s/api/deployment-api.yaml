apiVersion: apps/v1
kind: Deployment
metadata:
    name: radar-api
spec:
    replicas: 1
    selector:
        matchLabels:
            app: radar-api
    template:
        metadata:
            labels:
                app: radar-api
        spec:
            containers:
                - name: app
                  image: joanisky/radarpartners-api:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                        name: http
                  envFrom:
                      - configMapRef:
                            name: radar-api-config
                      # Secret créé par Jenkins : APP_SECRET, DATABASE_URL
                      - secretRef:
                            name: radar-api-env
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "384Mi"
                          cpu: "300m"
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: 80
                      initialDelaySeconds: 20
                      periodSeconds: 20
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
