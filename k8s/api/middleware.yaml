# Démo publique : pas d'indexation, débit limité par IP (le chat plus strictement).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: radar-noindex
spec:
    headers:
        customResponseHeaders:
            X-Robots-Tag: "noindex, nofollow"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: radar-api-ratelimit
spec:
    rateLimit:
        average: 30
        burst: 60
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
    name: radar-chat-ratelimit
spec:
    rateLimit:
        average: 6
        period: 1m
        burst: 3
