# Route plus spécifique que l'ingress principal : le chat est limité plus strictement.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: radar-api-chat-ingress
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: radarpartners-api-radar-noindex@kubernetescrd,radarpartners-api-radar-chat-ratelimit@kubernetescrd
spec:
    tls:
        - hosts:
              - api.radar.jonathanlore.fr
    rules:
        - host: api.radar.jonathanlore.fr
          http:
              paths:
                  - path: /api/chat
                    pathType: Prefix
                    backend:
                        service:
                            name: radar-api
                            port:
                                number: 80
