# Remet la démo à zéro chaque lundi à 3 h (les dates fictives sont relatives à « maintenant »).
apiVersion: batch/v1
kind: CronJob
metadata:
    name: radar-demo-reset
spec:
    schedule: "0 3 * * 1"
    timeZone: Europe/Paris
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    jobTemplate:
        spec:
            backoffLimit: 2
            template:
                spec:
                    restartPolicy: Never
                    containers:
                        - name: seed
                          image: joanisky/radarpartners-api:latest
                          imagePullPolicy: Always
                          command: ["php", "bin/console", "app:demo:seed", "--no-interaction"]
                          envFrom:
                              - configMapRef:
                                    name: radar-api-config
                              - secretRef:
                                    name: radar-api-env
                          resources:
                              requests:
                                  memory: "128Mi"
                                  cpu: "50m"
                              limits:
                                  memory: "384Mi"
                                  cpu: "300m"
